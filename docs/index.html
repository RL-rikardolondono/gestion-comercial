<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="gc-api" content="https://api-comercial.skynetgenesis.com">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#EEF2F1}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="shim.js"></script>
</head><body>
<title>Gestión ComercIAl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — left rail navigation, working canvas on the right; rail becomes a scrolling top strip on phones */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#E2E9E7; --line:#CFD9D6;
  --ink:#15232B; --ink-2:#43535C; --ink-3:#71818A;
  --accent:#1E3A4C; --accent-ink:#FFFFFF; --accent-soft:#DCE6EC;
  --signal:#E0A21A; --signal-ink:#15232B; --signal-soft:#FBEFD2;
  --wa:#1F8A4C; --wa-soft:#DDF1E4;
  --ok:#1F8A4C; --ok-soft:#DDF1E4; --warn:#A86F00; --warn-soft:#FBEFD2; --bad:#C2413B; --bad-soft:#F8DEDC;
  --bubble-in:#FFFFFF; --bubble-bot:#DCE6EC; --bubble-auto:#FBEFD2; --bubble-agent:#E4ECE9;
  --rail:#1E3A4C; --rail-ink:#E6EEF2; --rail-dim:#9DB3C0;
  --f-display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A20; --surface:#16242C; --surface-2:#1D2E37; --line:#2B3F49;
  --ink:#E6EEF0; --ink-2:#B2C2C9; --ink-3:#7E9099;
  --accent:#4C86A8; --accent-ink:#FFFFFF; --accent-soft:#1E3A4C;
  --signal:#E0A21A; --signal-ink:#15232B; --signal-soft:#3A2E12;
  --wa:#2FA862; --wa-soft:#163326;
  --ok:#4CC27E; --ok-soft:#163326; --warn:#E8B547; --warn-soft:#3A2E12; --bad:#EF7A73; --bad-soft:#3D1D1B;
  --bubble-in:#1D2E37; --bubble-bot:#1E3A4C; --bubble-auto:#3A2E12; --bubble-agent:#22323A;
  --rail:#12232D; --rail-ink:#E6EEF2; --rail-dim:#86A0AE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A20; --surface:#16242C; --surface-2:#1D2E37; --line:#2B3F49;
  --ink:#E6EEF0; --ink-2:#B2C2C9; --ink-3:#7E9099;
  --accent:#4C86A8; --accent-ink:#FFFFFF; --accent-soft:#1E3A4C;
  --signal:#E0A21A; --signal-ink:#15232B; --signal-soft:#3A2E12;
  --wa:#2FA862; --wa-soft:#163326;
  --ok:#4CC27E; --ok-soft:#163326; --warn:#E8B547; --warn-soft:#3A2E12; --bad:#EF7A73; --bad-soft:#3D1D1B;
  --bubble-in:#1D2E37; --bubble-bot:#1E3A4C; --bubble-auto:#3A2E12; --bubble-agent:#22323A;
  --rail:#12232D; --rail-ink:#E6EEF2; --rail-dim:#86A0AE; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.brand b i{font-style:normal;color:var(--signal)}
.brand span{font-size:12px;color:var(--rail-dim)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--rail-ink);font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--signal);color:var(--signal-ink);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--signal)}
.nav .count{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-dim);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:var(--warn)}
main{padding-block:24px 48px;padding-inline:28px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:34px;margin:0;letter-spacing:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warm{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 12px}
.panel h3{font-size:13px;margin:0 0 8px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi small{color:var(--ink-2);font-weight:500}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi em{font-style:normal;font-size:12px;color:var(--ink-3)}
.kpi.alert{border-color:var(--signal);background:var(--signal-soft)}
.kpi.good b{color:var(--ok)}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.wa{background:#DCF5E3;color:#166B3A}.chip.web{background:var(--accent-soft);color:var(--accent)}.chip.email{background:var(--bubble-agent);color:#3B4E8C}
.chip.form{background:var(--warn-soft);color:var(--warn)}.chip.ig{background:#F6DDEB;color:#9B2A63}.chip.fb{background:#DDE6F8;color:#2D4E9B}
.chip.csv,.chip.manual{background:var(--surface-2);color:var(--ink-2)}
:root[data-theme="dark"] .chip.wa{background:#173326;color:#7FD9A1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.wa{background:#173326;color:#7FD9A1}:root:not([data-theme="light"]) .chip.email{color:#A9B8EE}:root:not([data-theme="light"]) .chip.ig{background:#3A1C2D;color:#F0A3CB}:root:not([data-theme="light"]) .chip.fb{background:#1D2740;color:#A7BDF0}}
:root[data-theme="dark"] .chip.email{color:#A9B8EE}:root[data-theme="dark"] .chip.ig{background:#3A1C2D;color:#F0A3CB}:root[data-theme="dark"] .chip.fb{background:#1D2740;color:#A7BDF0}
.chip.due{background:var(--signal-soft);color:var(--signal)}
.chip.hand{background:var(--bad-soft);color:var(--bad)}
.chip.demo{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-3)}
.chip.st-ganado{background:var(--ok-soft);color:var(--ok)}.chip.st-perdido{background:var(--bad-soft);color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .l{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.bars .l span:last-child{text-align:right}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{min-width:0;flex:1}
.item .t b{display:block}
.item .t p{margin:2px 0 0;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}
/* inbox */
.inbox{display:grid;grid-template-columns:290px minmax(0,1fr) 270px;gap:14px;align-items:start}
.convs{max-height:72vh;overflow:auto;padding:8px}
.conv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:8px;width:100%}
.conv:hover{background:var(--surface-2)}
.conv[aria-current="true"]{background:var(--accent-soft)}
.conv .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.conv .top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv p{margin:0;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;min-height:60vh}
.msgs{flex:1;display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface-2);border-radius:8px;overflow:auto;max-height:56vh;min-height:300px}
.msg{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--bubble-in);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg.out{align-self:flex-end}
.msg.bot{background:var(--bubble-bot);border-color:transparent}
.msg.auto{background:var(--bubble-auto);border-color:transparent}
.msg.agente{background:var(--bubble-agent);border-color:transparent}
.msg small{display:block;font-size:11px;color:var(--ink-3);margin-top:4px}
.msg.typing{color:var(--ink-3);font-style:italic}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:10px}
textarea,input[type=text],input[type=email],input[type=tel],input[type=number],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fields{display:grid;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;overflow-wrap:anywhere}
.score{font-family:var(--f-mono);font-weight:500}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--accent)}
.col header{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:2px 4px}
.col header span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.card b{overflow-wrap:anywhere}
.card p{margin:0;font-size:12.5px;color:var(--ink-2)}
.card .meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.card select{padding:4px 6px;font-size:12px}
/* steps */
.step{display:grid;grid-template-columns:auto 110px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .n{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 8px;margin-top:6px}
.clock{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:6px 10px;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-top:0}
.tablewrap{overflow-x:auto}
/* phone sim */
.phone{max-width:380px;width:100%;margin:0 auto;border:1px solid var(--line);border-radius:26px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.phone .ph-top{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;border-bottom:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);flex:none}
.phone .msgs{max-height:420px;min-height:360px}
.code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre}
.conn{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.conn .c{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.conn .c b{font-size:14px}
.conn .c p{margin:0;font-size:12.5px;color:var(--ink-2)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plan{display:flex;flex-direction:column;gap:10px}
.plan .price{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.plan .price small{font-size:14px;font-family:var(--f-body);color:var(--ink-3);font-weight:500}
.plan ul{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.plan.feat{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.userbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.userbar select{width:auto;max-width:100%;padding:5px 8px}
.avatar.sm{width:28px;height:28px;font-size:13px}
.chip.role-admin{background:var(--accent-soft);color:var(--accent)}.chip.role-supervisor{background:var(--bubble-agent);color:var(--ink-2)}.chip.role-asesor{background:var(--warn-soft);color:var(--warn)}
.brand-logo{display:flex;align-items:center;gap:10px}
.brand-logo img.logo{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;flex:none}
.brand-logo b.co{font-family:var(--f-display);font-size:16px;line-height:1.15;display:block}
.brand-logo span{font-size:11.5px;color:var(--rail-dim)}.brand-logo span i,.brand b i{font-style:normal;color:var(--signal)}
.logo-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-box .prev{width:96px;height:96px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden;color:#7A8984;font-size:12px;text-align:center}
.logo-box .prev img{max-width:100%;max-height:100%;object-fit:contain}
.avatar img{width:100%;height:100%;object-fit:contain;border-radius:50%;background:#fff}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}
.nav .lock{font-size:10.5px;border:1px solid var(--rail-dim);color:var(--rail-dim);border-radius:99px;padding:0 6px}
.conn .c.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bars.money .l{grid-template-columns:110px 1fr auto}
.grid.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1100px){.grid.split{grid-template-columns:1fr}}
.chip.wa{background:var(--wa-soft)!important;color:var(--wa)!important}
.brand b{letter-spacing:.01em}
.head h1,.panel h2,.kpi b,.plan .price{font-family:var(--f-display)}
.agenda{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.agenda .col header{flex-direction:column;align-items:flex-start;gap:2px}.agenda .col header span:last-child{font-weight:400;font-size:11.5px;color:var(--ink-3)}
.agenda .col.today{outline:2px solid var(--signal)}
.cat-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.cat-row:first-of-type{border-top:0}
.cat-row img,.cat-row .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
table.heat{width:auto}table.heat td{width:22px;min-width:22px;height:20px;padding:0;border:2px solid var(--surface)}table.heat th{font-size:10px;padding:2px;text-align:center}
.qr{gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.sheet{position:fixed;inset:0;background:rgba(10,20,17,.45);display:grid;place-items:center;padding:16px;z-index:40}
.sheet .panel{width:min(520px,100%);max-height:90vh;overflow:auto}
@media (max-width:1180px){.inbox{grid-template-columns:260px minmax(0,1fr)}.inbox .side{grid-column:1 / -1}}
@media (max-width:860px){
  .brand-logo span{display:none}.brand-logo img.logo{width:32px;height:32px}.brand-logo b.co{font-size:14px;white-space:nowrap}
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:30;overflow-x:auto}
  .brand span,.rail-foot{display:none}
  .brand b{font-size:20px}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:7px 10px}
  main{padding-inline:16px}
  .g2,.g3{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr}
  .convs{max-height:260px}
  .step{grid-template-columns:auto 1fr}
  .step textarea{grid-column:1 / -1}
  .bars .l{grid-template-columns:90px 1fr 30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* Asistente automático SIN inteligencia artificial (sin costo por mensaje).
   Entiende preguntas por palabras clave y por la Base de conocimiento, muestra un menú,
   ofrece horarios de la agenda y agenda la cita, y avisa a un asesor cuando no sabe.
   Se usa igual en la app (navegador) y en el servidor. */
(function (root) {
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¿?¡!.,;:()"]/g, " ").replace(/\s+/g, " ").trim();
  const stem = (w) => w.replace(/(es|s)$/, "").replace(/(cion|ciones)$/, "cion");
  const STOP = new Set("el la los las un una unos unas de del al a en y o u que por para con sin su sus mi mis me te se le lo es son hay como cual cuales esto eso este esta quiero quisiera queria saber tienen tiene usted ustedes favor buenas buenos hola dias tardes noches gracias".split(" "));
  const words = (s) => norm(s).split(" ").filter((w) => w.length > 2 && !STOP.has(w)).map(stem);
  const GENERIC = new Set(["cuanto", "cuesta", "cuestan", "precio", "valor", "costo", "vale", "cobran", "hacen", "manejan", "ofrecen", "atienden", "donde", "queda", "quedan", "horario", "hora", "puedo", "necesito", "busco", "informacion", "info", "cita", "citas", "agendar", "agenda", "reservar", "turno", "quiero"].map(stem));
  const keyWords = (s) => words(s).filter((w) => !GENERIC.has(w));
  const has = (nt, list) => list.some((k) => (k.endsWith("*") ? new RegExp("\\b" + k.slice(0, -1)).test(nt) : new RegExp("\\b" + k + "\\b").test(nt)));
  const INTENTS = {
    human: ["asesor", "asesora", "persona", "humano", "hablar con", "llamar*", "llamada", "queja", "reclamo", "molest*", "gerente", "encargad*"],
    cita: ["cita*", "agend*", "reserv*", "turno", "disponib*", "espacio", "programar"],
    precio: ["precio*", "cuesta*", "cuanto", "valor*", "costo*", "tarifa*", "cobran", "vale", "cotiza*", "promocion*", "descuento*"],
    horario: ["horario*", "hora", "horas", "abren", "cierran", "atienden", "abierto*", "sabado*", "domingo*", "festivo*"],
    ubicacion: ["donde", "direccion", "ubica*", "llegar", "sede*", "queda*", "barrio"],
    pago: ["pago*", "pagar", "nequi", "daviplata", "tarjeta*", "transferencia*", "efectivo", "credito", "cuota*", "financ*", "pse"],
    gracias: ["gracias", "muy amable", "perfecto", "listo"],
    saludo: ["hola", "buenas", "buenos dias", "buenas tardes", "buenas noches", "saludos"],
  };
  const MENU_KEYS = { 1: "precio", 2: "horario", 3: "cita", 4: "human" };

  function extract(text) {
    const out = {};
    const em = String(text).match(/[\w.+-]+@[\w-]+\.[\w.-]+/); if (em) out.email = em[0];
    const ph = String(text).replace(/[\s.-]/g, "").match(/(\+?57)?3\d{9}\b/); if (ph) out.phone = ph[0];
    const nm = String(text).match(/(?:me llamo|mi nombre es|habla|le escribe)\s+([A-Za-zÁÉÍÓÚÑáéíóúñ]+(?:\s+[A-Za-zÁÉÍÓÚÑáéíóúñ]+)?)/i)
      || String(text).match(/\bsoy\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?)/);
    if (nm) out.name = nm[1].replace(/\b\w/g, (c) => c.toUpperCase());
    return out;
  }
  function bestFaq(c, text) {
    const w = new Set(keyWords(text)); let best = null, bs = 0;
    for (const f of c.faqs || []) {
      if (!f.q || !f.a) continue;
      const fw = new Set(keyWords(f.q)); let s = 0; fw.forEach((x) => { if (w.has(x)) s++; });
      const score = fw.size ? s / Math.min(fw.size, Math.max(w.size, 1)) : 0;
      if (s > 0 && (score > bs || (score === bs && best && s > best.s))) { bs = score; best = { f, s, score }; }
    }
    return best;
  }
  function catalogHit(c, text) {
    const w = new Set(words(text)); let best = null, bs = 0;
    for (const it of c.catalog || []) { if (!it.n) continue; const iw = words(it.n); const s = iw.filter((x) => w.has(x)).length; if (s > bs) { bs = s; best = it; } }
    return bs ? best : null;
  }
  const lineOf = (txt, re) => String(txt || "").split(/\n|(?<=\.)\s+/).find((x) => re.test(norm(x)));
  const cop = (n) => "$" + Math.round(Number(n) || 0).toLocaleString("es-CO");

  /* c = { company, assistant, services, extra, hoursText, phone, faqs, catalog, payInfo, payLink, sedes:[{name,address,hours}],
          agendaOn, agendaServices:[], slots:(n)=>[ts], fmt:(ts)=>texto, openNow:boolean, nextOpenText:"" } */
  function reply(c, lead, text) {
    const nt = norm(text), st = { ...(lead.bot || {}) }, ex = extract(text);
    const r = { reply: "", score: lead.score || 20, stage: null, handoff: false, botState: st };
    if (ex.name && !lead.name) r.name = ex.name;
    if (ex.phone && !lead.phone) r.phone = ex.phone;
    if (ex.email && !lead.email) r.email = ex.email;
    const menu = `Puedo ayudarle con:\n1. Servicios y precios\n2. Horario y ubicación\n3. Agendar una cita\n4. Hablar con un asesor\nResponda con el número.`;
    const num = (nt.match(/^(?:opcion |la |el |numero )?([1-9])$/) || [])[1];
    const ordinal = { primer: 1, primera: 1, segund: 2, tercer: 3 }; let ord = null;
    for (const [k, v] of Object.entries(ordinal)) if (new RegExp("\\b" + k).test(nt)) ord = v;

    // 1. Respuesta a la oferta de horarios
    if (st.slots && st.slots.length && (num || ord)) {
      const i = Number(num || ord) - 1;
      if (st.slots[i]) {
        r.book = st.slots[i]; r.service = st.service || "cita";
        r.reply = `Listo${lead.name || r.name ? ", " + String(lead.name || r.name).split(" ")[0] : ""}. Su ${r.service === "cita" ? "cita" : "cita de " + r.service} quedó para el ${String(c.fmt(r.book)).replace(/\.$/, "")}. Le enviaremos un recordatorio.${!lead.phone && !r.phone && lead.channel !== "whatsapp" ? " ¿Me regala un número de WhatsApp para confirmarle?" : ""}`;
        r.score = Math.max(r.score, 75); r.stage = "propuesta"; st.slots = null; st.menu = false; return r;
      }
    }
    // 2. Respuesta al menú
    let intent = null;
    if (num && st.menu && MENU_KEYS[num]) intent = MENU_KEYS[num];
    // 3. Nombre cuando se le pidió
    if (!intent && st.askedName && !lead.name && !r.name && /^[a-záéíóúñ]+( [a-záéíóúñ]+){0,2}$/i.test(String(text).trim()) && !has(nt, [].concat(...Object.values(INTENTS)))) {
      r.name = String(text).trim().replace(/\b\w/g, (x) => x.toUpperCase()); st.askedName = false;
      r.reply = `Mucho gusto, ${r.name.split(" ")[0]}. ${menu}`; st.menu = true; return r;
    }
    // 4. Intención por palabras clave y base de conocimiento
    const faq = bestFaq(c, text);
    if (!intent) {
      if (has(nt, INTENTS.human)) intent = "human";
      else if (has(nt, INTENTS.cita) && !(faq && has(norm(faq.f.q), INTENTS.cita))) intent = "cita";
      else if (faq && faq.score >= 0.5 && !(catalogHit(c, text) && !keyWords(faq.f.q).some((x) => keyWords(catalogHit(c, text).n).includes(x)))) intent = "faq";
      else if (has(nt, INTENTS.cita)) intent = "cita";
      else if (has(nt, INTENTS.precio)) intent = "precio";
      else if (has(nt, INTENTS.horario)) intent = "horario";
      else if (has(nt, INTENTS.ubicacion)) intent = "ubicacion";
      else if (has(nt, INTENTS.pago)) intent = "pago";
      else if (faq && faq.s >= 1 && faq.score >= 0.34) intent = "faq";
      else if (has(nt, INTENTS.gracias)) intent = "gracias";
      else if (has(nt, INTENTS.saludo) || nt.length < 3) intent = "saludo";
    }
    const item = catalogHit(c, text);
    if (item && !lead.interest) r.interest = item.n;
    switch (intent) {
      case "human":
        r.handoff = true; r.reply = `Con gusto. Ya le aviso a un asesor para que le escriba${c.openNow ? " en breve" : " " + (c.nextOpenText || "apenas abramos")}.`; break;
      case "faq":
        r.reply = faq.f.a; r.score += 10; r.stage = "interesado"; if (!lead.interest) r.interest = String(faq.f.q).replace(/[¿?]/g, "").slice(0, 60); break;
      case "cita": {
        if (!c.agendaOn) { r.handoff = true; r.reply = "Con gusto le agendamos. Un asesor le escribirá para acordar el día y la hora."; break; }
        const slots = (c.slots(3) || []);
        if (!slots.length) { r.handoff = true; r.reply = "En este momento no veo espacios libres en la agenda. Un asesor le escribirá para buscarle un horario."; break; }
        const svc = (c.agendaServices || []).find((s) => keyWords(text).some((w) => keyWords(s).includes(w)));
        st.slots = slots; st.service = svc || ""; st.menu = false;
        r.reply = `Tengo estos espacios${svc ? " para " + svc : ""}:\n${slots.map((t, i) => `${i + 1}. ${c.fmt(t)}`).join("\n")}\nResponda con el número que prefiera.`;
        r.score = Math.max(r.score, 55); r.stage = "interesado"; break;
      }
      case "precio":
        if (item) r.reply = `${item.n} tiene un valor de ${cop(item.p)}${item.d ? " (" + item.d + ")" : ""}.`;
        else if ((c.catalog || []).filter((x) => x.n).length) r.reply = `Estos son nuestros precios:\n${c.catalog.filter((x) => x.n).slice(0, 8).map((x) => `• ${x.n}: ${cop(x.p)}`).join("\n")}`;
        else if (c.services) r.reply = String(c.services).slice(0, 700);
        else { r.handoff = true; r.reply = "Un asesor le compartirá los precios en breve."; }
        if (!r.handoff) r.reply += "\n¿Desea agendar una cita? Responda 3.";
        st.menu = true; r.score += 15; r.stage = "interesado"; break;
      case "horario": {
        const sedes = (c.sedes || []).filter((x) => x.hours).map((x) => `• ${x.name}: ${x.hours}`).join("\n");
        r.reply = (c.hoursText ? `Nuestro horario es: ${String(c.hoursText).replace(/\.$/, "")}.` : "Le comparto nuestro horario de atención.") + (sedes ? `\n${sedes}` : "");
        const addr = lineOf(c.extra, /direccion|calle|carrera|cra|avenida|av /);
        if (addr && !sedes) r.reply += `\n${addr.trim()}`;
        r.reply += "\n¿Le ayudo con algo más? Responda 1 para precios o 3 para agendar."; st.menu = true; break;
      }
      case "ubicacion": {
        const sedes = (c.sedes || []).filter((x) => x.address).map((x) => `• ${x.name}: ${x.address}`).join("\n");
        const addr = lineOf(c.extra, /direccion|calle|carrera|cra|avenida|av |ubicad/);
        r.reply = sedes ? `Estas son nuestras sedes:\n${sedes}` : addr ? addr.trim() : `Un asesor le compartirá la ubicación de ${c.company}.`;
        if (!sedes && !addr) r.handoff = true; st.menu = true; break;
      }
      case "pago": {
        const p = c.payInfo || lineOf(c.extra, /pago|nequi|tarjeta|efectivo|transferencia/);
        r.reply = p ? String(p).trim() : "Un asesor le explicará los medios de pago."; if (!p) r.handoff = true;
        if (c.payLink) r.reply += `\nTambién puede pagar en línea aquí: ${c.payLink}`; break;
      }
      case "gracias":
        r.reply = `Con mucho gusto. Si necesita algo más, aquí estamos. ${c.company}.`; st.menu = false; break;
      case "saludo":
        r.reply = `Hola, soy ${c.assistant || "el asistente"} de ${c.company}. ${menu}`; st.menu = true; break;
      default:
        r.unknown = String(text).slice(0, 200); r.handoff = true;
        r.reply = `Esa pregunta se la responde mejor un asesor; ya le aviso para que le escriba${c.openNow ? "" : " " + (c.nextOpenText || "apenas abramos")}. Mientras tanto, ${menu.charAt(0).toLowerCase() + menu.slice(1)}`; st.menu = true;
    }
    if (!lead.name && !r.name && !st.askedName && intent !== "human" && !r.book) { r.reply += "\n¿Me regala su nombre, por favor?"; st.askedName = true; }
    if (r.name || r.phone || r.email) r.score += 10;
    r.score = Math.max(0, Math.min(100, r.score));
    return r;
  }
  const api = { reply, norm, extract };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.GC_BOT = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>

function resizeImage(file, M0){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("read"));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error("img"));
      img.onload=()=>{ const M=M0||240, k=Math.min(1,M/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let d=M0&&M0<200?c.toDataURL("image/jpeg",0.8):c.toDataURL("image/png"); if(d.length>150000) d=c.toDataURL("image/webp",0.85); if(d.length>150000) d=c.toDataURL("image/jpeg",0.85);
        res(d); };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function ruleReply(l){
  const c=S.config; const last=norm((l.messages||[]).filter(m=>m.from==="cliente").slice(-1)[0]?.text);
  const words=last.split(/[^a-z0-9ñ]+/).filter(w=>w.length>3);
  let best=null,bs=0;
  for(const f of c.faqs||[]){ const q=norm(f.q+" "+f.a); const s=words.filter(w=>q.includes(w)).length; if(s>bs){bs=s;best=f;} }
  const human=/asesor|persona|humano|queja|reclamo/.test(last);
  if(best && bs>0 && !human) return {reply:best.a+(l.name?"":" ¿Me regala su nombre para registrarlo?"), score:45, stage:"interesado", handoff:false};
  return {reply:`Gracias por escribir a ${c.company}. ${human?"Ya le aviso a un asesor para que lo contacte.":"Un asesor le responderá en breve."} ${l.name?"":"¿Me comparte su nombre y el servicio que le interesa?"}`.trim(), score:30, stage:"contactado", handoff:human};
}

async function botAnswer(id){

  if(r.phone && !l.phone) l.phone=String(r.phone).slice(0,40);
  if(r.email && !l.email) l.email=String(r.email).slice(0,80);
  if(r.interest) l.interest=String(r.interest).slice(0,80);
  if(Number.isFinite(Number(r.score)) && Number(r.score)>0) l.score=Math.max(0,Math.min(100,Math.round(Number(r.score))));
  if(r.stage && STAGE_ORDER[r.stage]!=null && STAGE_ORDER[r.stage]<4 && STAGE_ORDER[r.stage]>STAGE_ORDER[l.stage]) l.stage=r.stage;
  else if(l.stage==="nuevo") l.stage="contactado";
  l.handoff = !!r.handoff || l.handoff;
  l.awaiting="cliente"; l.lastOutboundAt=t;
  await writeLead(l);
  if(booked){ const a=await bookAppt(id, booked, r.service||l.interest, "asistente"); if(a) toast("El asistente agendó una cita"); }
}

function parseCSV(txt){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','||ch===';'){row.push(f);f="";} else if(ch==='\n'){row.push(f);rows.push(row);row=[];f="";} else if(ch!=='\r') f+=ch; }
  if(f||row.length){row.push(f);rows.push(row);} return rows.filter(r=>r.some(x=>x.trim()));
}
function importCSV(txt){
  const rows=parseCSV(txt); if(rows.length<2){toast("El archivo no tiene filas para importar.");return;}
  const h=rows[0].map(norm);
  const idx=k=>h.findIndex(x=>k.some(w=>x.includes(w)));
  const iN=idx(["nombre","name"]),iP=idx(["tel","cel","whats","phone"]),iE=idx(["correo","email","mail"]),iI=idx(["interes","servicio","producto","asunto"]),iV=idx(["valor","monto"]);
  let n=0;
  for(const r of rows.slice(1)){ const l=newLeadAssigned({channel:"csv", name:(r[iN]||"").trim(), phone:(r[iP]||"").trim(), email:(r[iE]||"").trim(), interest:(r[iI]||"").trim(), value:Number(String(r[iV]||"").replace(/[^\d]/g,""))||0});
    if(l.name||l.phone||l.email){ writeLead(l); n++; } }
  toast(`${n} prospectos importados`);
}
function toCSV(){
  const cols=["nombre","telefono","correo","canal","interes","etapa","puntaje","valor","creado","ultima_actividad"];
  const q=v=>'"'+String(v??"").replaceAll('"','""')+'"';
  const lines=[cols.join(",")].concat(leadsArr().map(l=>[l.name,l.phone,l.email,(CHANNELS[l.channel]||{}).label,l.interest,stageLabel(l.stage),l.score,l.value,new Date(l.createdAt).toISOString(),new Date(l.updatedAt).toISOString()].map(q).join(",")));
  return "\ufeff"+lines.join("\n");
}

    <p class="muted" style="margin:0;font-size:12.5px">${nf?`Próximo seguimiento automático: paso ${nf.step+1} ${ago(nf.at)}.`:l.awaiting==="empresa"?"El cliente espera una respuesta de la empresa.":"Sin seguimientos programados."}</p></div></div>`;

    <label class="f">Etapa<select id="f-stage">${STAGES.map(s=>`<option value="${s.id}" ${l.stage===s.id?"selected":""}>${s.label}</option>`).join("")}</select></label>
    <label class="f">Valor estimado (COP)<input type="number" id="f-value" value="${Number(l.value)||0}" min="0" step="1000"></label>
    ${featOn("sedes")&&S.sedes.size?`<label class="f">Sede${sedeSelect("f-sede",l.sede||"",false)}</label>`:""}
    <label class="f">Notas<textarea id="f-notes">${esc(l.notes)}</textarea></label>
    ${can("assign")?`<label class="f">Asesor asignado<select id="f-owner"><option value="">Sin asignar</option>${usersArr().filter(u=>u.active!==false).map(u=>`<option value="${u.id}" ${l.owner===u.id?"selected":""}>${esc(u.name)} · ${ROLES[u.role]?.label||""}</option>`).join("")}</select></label>`
      :`<div class="row" style="justify-content:space-between"><span class="muted">Asesor: <b>${esc(l.owner?userName(l.owner):"Sin asignar")}</b></span>${!l.owner&&me().id!=="_admin"?'<button class="btn sm" data-act="take">Tomar este prospecto</button>':""}</div>`}
    <dl class="kv"><dt>Puntaje</dt><dd class="score">${l.score||0}/100</dd><dt>Creado</dt><dd>${ago(l.createdAt)}</dd><dt>Seguimientos</dt><dd>${l.followStep||0} de ${(S.config.steps||[]).length}</dd></dl>
    <h3 style="margin-top:6px">Tareas</h3>${(l.tasks||[]).filter(t=>!t.done).map(t=>`<label class="toggle"><input type="checkbox" data-ptask="${l.id}|${t.id}"> ${esc(t.text)}${t.due?` <span class="muted">· ${fdt(t.due)}</span>`:""}</label>`).join("")||'<p class="muted" style="margin:0">Sin tareas pendientes.</p>'}

    ${biz().agendaOn?`<h3 style="margin-top:6px">Citas</h3>${apptArr().filter(a=>a.leadId===l.id).map(a=>`<p style="margin:0;font-size:13px">${esc(fdt(a.at))} · ${esc(a.service)} <span class="chip">${a.status}</span></p>`).join("")||'<p class="muted" style="margin:0">Sin citas.</p>'}
      <select id="bk-svc" aria-label="Servicio">${(biz().services.length?biz().services:["Cita"]).map(x=>`<option>${esc(x)}</option>`).join("")}</select>
      <div class="row" style="flex-wrap:nowrap"><select id="bk-slot" aria-label="Horario">${freeSlots(20).map(t=>`<option value="${t}">${esc(fdt(t))}</option>`).join("")}</select><button class="btn sm" data-pact="bookfor">Agendar</button></div>`:""}
    ${(biz().catalog||[]).filter(c=>c.n).length?`<h3 style="margin-top:6px">Enviar cotización</h3>${biz().catalog.map((c,i)=>c.n?`<label class="toggle"><input type="checkbox" data-qitem="${i}"> ${esc(c.n)} <span class="muted mono">${cop(c.p)}</span></label>`:"").join("")}<div><button class="btn sm" data-pact="quote">Enviar cotización al cliente</button></div>`:""}
    ${featOn("collect")&&canView("cobros")?(()=>{const mine=[...S.invoices.values()].filter(i=>i.leadId===l.id);const b=mine.reduce((s,i)=>s+balOf(i),0);return `<div class="note"><b>Cuentas por cobrar:</b> ${mine.length?`${mine.length} · saldo ${cop(b)}${mine.some(i=>balOf(i)>0&&lateDays(i)>0)?' <span class="chip hand">En mora</span>':""}`:"ninguna"}<div class="row" style="margin-top:6px"><button class="btn sm" data-newinv="${l.id}">Crear cuenta por cobrar</button>${mine.length?'<button class="btn sm ghost" data-view="cobros">Ver cobros</button>':""}</div></div>`})():""}

function vFollow(){
  const c=S.config, L=leadsArr();
  const sched=L.map(l=>({l,n:nextFollow(l)})).filter(x=>x.n).sort((a,b)=>a.n.at-b.n.at);
  const sent=L.flatMap(l=>(l.messages||[]).filter(m=>m.from==="auto").map(m=>({...m,l}))).sort((a,b)=>b.at-a.at).slice(0,10);
  return head("Seguimiento automático","Si un cliente deja de responder, el sistema le escribe en los tiempos que usted defina. Cuando el cliente contesta, la secuencia se detiene.",
    `<span class="clock">${clockStr()}</span>${SRV?"":`<button class="btn" data-act="adv6">Adelantar 6 h</button><button class="btn" data-act="adv24">Adelantar 1 día</button>`}${clockOffset?'<button class="btn ghost" data-act="advreset">Hora real</button>':""}`)
  + `<div class="grid g2">
  <div class="panel"><h2>Secuencia de mensajes</h2>
    <div class="row" style="margin-bottom:8px"><label class="toggle"><input type="checkbox" id="autoFollow" ${c.autoFollow?"checked":""}> Enviar seguimientos automáticamente</label>${aiOn()?`<label class="toggle"><input type="checkbox" id="aiFollow" ${c.aiFollow?"checked":""}> Personalizar cada mensaje con IA</label>`:""}</div>
    ${(c.steps||[]).map((s,i)=>`<div class="step"><span class="n">Paso ${i+1}</span><label class="f">Esperar (horas)<input type="number" id="st-h-${i}" min="0" step="1" value="${Number(s.hours)||0}"></label><label class="f">Mensaje<textarea id="st-t-${i}">${esc(s.text)}</textarea></label><button class="btn sm ghost" data-delstep="${i}" aria-label="Quitar paso ${i+1}" style="margin-top:20px">Quitar</button></div>`).join("")}
    <p class="muted" style="font-size:12.5px">Variables: <span class="mono">{nombre} {empresa} {interes}</span>. Las horas cuentan desde el último mensaje enviado al cliente.</p>
    <div class="row"><button class="btn" data-act="addstep">Agregar paso</button><button class="btn primary" data-act="savesteps">Guardar secuencia</button></div></div>
  <div class="grid">
    <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Cola de seguimientos</h2><button class="btn warm sm" data-act="runeng">Enviar los vencidos ahora</button></div>
      ${sched.length?`<div class="tablewrap"><table><thead><tr><th>Prospecto</th><th>Paso</th><th>Cuándo</th><th></th></tr></thead><tbody>${sched.map(({l,n})=>`<tr><td><b>${esc(l.name||"Sin nombre")}</b><br>${chip(l.channel)}</td><td class="mono">${n.step+1}/${c.steps.length}</td><td>${n.at<=now()?'<span class="chip due">Vencido</span>':ago(n.at)}</td><td><button class="btn sm" data-follow="${l.id}">Enviar ya</button></td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">No hay seguimientos programados. Aparecen cuando la empresa responde y el cliente no contesta.</p>'}
      <p class="note">${SRV?"El servidor revisa la cola cada minuto, todo el día, aunque nadie tenga la aplicación abierta.":"En esta versión de prueba el motor funciona mientras la página está abierta. Use “Adelantar” para ver qué pasaría con el paso del tiempo. En la versión publicada corre todo el día en el servidor."}</p></div>
    <div class="panel"><h2>Últimos seguimientos enviados</h2>${sent.length?`<div class="list">${sent.map(m=>`<div class="item"><div class="t"><b>${esc(m.l.name||"Sin nombre")} · paso ${m.step||"?"}</b><p>${esc(m.text)}</p></div><span class="muted" style="white-space:nowrap">${ago(m.at)}</span></div>`).join("")}</div>`:'<p class="muted">Todavía no se ha enviado ninguno.</p>'}</div>
  </div></div>`;
}

const tenantFee = t => planPrice(t.plan) + extraSedes(t)*(platform().pricing.sede||0);

    ${T.map(t=>`<tr><td><b>${esc(t.name)}</b>${t.id===S.tid?' <span class="chip web">Abierta</span>':""}<br><span class="muted">${esc(t.sector||"")}</span></td>

/* ---------- reports ---------- */
function monthsBack(n){ const out=[]; const d=new Date(now()); d.setDate(1); for(let i=0;i<n;i++){ out.push(mk(d.getTime())); d.setMonth(d.getMonth()-1); } return out; }
const MES = m => { const [y,mm]=m.split("-"); return ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][Number(mm)-1]+" "+y; };
function reportData(m){
  const inM = ts => ts && mk(ts)===m;
  const L=allLeads().filter(l=>!S.sedeFilter || l.sede===S.sedeFilter);
  const created=L.filter(l=>inM(l.createdAt));
  const convs=L.filter(l=>(l.messages||[]).some(x=>x.from==="cliente"&&inM(x.at)));
  const msgs=L.flatMap(l=>(l.messages||[]).filter(x=>inM(x.at)));
  const won=L.filter(l=>l.stage==="ganado" && inM(l.wonAt||l.updatedAt));
  const lost=L.filter(l=>l.stage==="perdido" && inM(l.updatedAt));
  const resp=L.flatMap(l=>{const r=[],ms=l.messages||[];for(let i=0;i<ms.length-1;i++) if(ms[i].from==="cliente"&&ms[i+1].from!=="cliente"&&inM(ms[i].at)) r.push(ms[i+1].at-ms[i].at); return r;});
  const avg=resp.length?resp.reduce((a,b)=>a+b,0)/resp.length/1000:0;
  const byCh=Object.keys(CHANNELS).map(k=>[CHANNELS[k].label,created.filter(l=>l.channel===k).length]).filter(x=>x[1]);
  const people=[...usersArr()].map(u=>({name:u.name, role:ROLES[u.role]?.label, assigned:L.filter(l=>l.owner===u.id).length, sent:msgs.filter(x=>x.from==="agente"&&x.by===u.id).length, won:won.filter(l=>l.owner===u.id).length}));
  const bySede=sedesArr().map(x=>[x.name, created.filter(l=>l.sede===x.id).length]);
  return {created, convs, msgs, won, lost, avg, byCh, people, bySede,
    bot:msgs.filter(x=>x.from==="bot").length, auto:msgs.filter(x=>x.from==="auto").length, agent:msgs.filter(x=>x.from==="agente").length,
    value:won.reduce((s,l)=>s+(Number(l.value)||0),0)};
}
function vReports(){
  const months=monthsBack(6); const m=S.repMonth&&months.includes(S.repMonth)?S.repMonth:months[0];
  const r=reportData(m), cur=m===monthKey();

  <div class="grid g2">

    ${advancedReports(m)}

  </div>`;
}
function reportCSV(m){
  const r=reportData(m), q=v=>'"'+String(v??"").replaceAll('"','""')+'"';
  const rows=[["Informe",S.config.company,MES(m)],[],["Indicador","Valor"],["Conversaciones atendidas",r.convs.length],["Prospectos nuevos",r.created.length],["Ventas ganadas",r.won.length],["Valor ganado (COP)",r.value],["Perdidos",r.lost.length],["Respuestas de la IA",r.bot],["Mensajes de asesores",r.agent],["Seguimientos automáticos",r.auto],[],["Canal","Prospectos nuevos"],...r.byCh,[],["Persona","Asignados","Mensajes","Ganados"],...r.people.map(p=>[p.name,p.assigned,p.sent,p.won])];

async function saveFile(filename, text){
  if(S.downloads){ try{ await S.downloads.save({filename, data:new Blob([text],{type:"text/csv"})}); }catch(err){ if(err&&err.code!=="cancelled"&&err.code!=="declined") toast("No se pudo descargar el archivo."); } }
  else { try{ await navigator.clipboard.writeText(text); toast("Copiado al portapapeles"); }catch{ toast("La descarga no está disponible en esta vista."); } }
}

const PAY_METHODS = ["Transferencia","Efectivo","Nequi","Daviplata","Tarjeta","PSE","Otro"];
const collectCfg = () => ({...COLLECT_DEFAULT, ...(S.config.collect||{}), steps:(S.config.collect?.steps)||COLLECT_DEFAULT.steps});
const invArr = () => [...S.invoices.values()].sort((a,b)=>(a.dueAt||0)-(b.dueAt||0));
const paidOf = i => (i.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
const balOf = i => Math.max(0,(Number(i.amount)||0)-paidOf(i));
const lateDays = i => Math.floor((now()-(i.dueAt||0))/DAY);
function invStatus(i){
  if(balOf(i)<=0) return "pagada";
  if(lateDays(i)>0) return "vencida";
  if(paidOf(i)>0) return "parcial";
  if(i.agreement) return "acuerdo";
  return "pendiente";
}
const INV_ST = {pagada:["Pagada","st-ganado"], vencida:["Vencida","hand"], parcial:["Abono parcial","due"], acuerdo:["Acuerdo de pago","web"], pendiente:["Al día","chip"]};
const fdate = ts => ts ? new Date(ts).toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"}) : "—";
const toDateInput = ts => { const d=new Date(ts||now()); const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const fromDateInput = v => { const [y,m,d]=String(v).split("-").map(Number); return y? new Date(y,m-1,d,12).getTime() : now(); };
function fillCollect(t, inv){
  const c=collectCfg();
  return String(t||"").replaceAll("{nombre}", (inv.client||"").replace(/^Ejemplo\s*·\s*/,"").split(" ")[0]||"")
    .replaceAll("{empresa}", S.config.company||"").replaceAll("{valor}", cop(inv.amount)).replaceAll("{saldo}", cop(balOf(inv)))
    .replaceAll("{concepto}", inv.concept||"su servicio").replaceAll("{vence}", fdate(inv.dueAt)).replaceAll("{numero}", inv.number||"")
    .replaceAll("{pago}", c.payInfo||"").replace(/\s+/g," ").trim();
}
function nextReminder(inv){
  const c=collectCfg(); if(!c.enabled || inv.paused || balOf(inv)<=0) return null;
  const sent=inv.sent||[];
  for(let k=0;k<c.steps.length;k++){ if(!sent.includes(k)) return {step:k, at:(inv.dueAt||0)+(Number(c.steps[k].offset)||0)*DAY}; }
  return null;
}
function writeInvoice(inv){ inv.updatedAt=Date.now(); S.invoices.set(inv.id,inv); render(); const b=JSON.parse(JSON.stringify(inv)); delete b.id; return writeDoc(P("invoices/"+inv.id), b); }

function nextNumber(){ const n=invArr().map(i=>Number(String(i.number||"").match(/(\d+)/)?.[1])||0); return Math.max(0,...n)+1; }
async function sendReminder(id, text, stepIdx, auto){
  const inv=structuredClone(S.invoices.get(id)); if(!inv) return;
  const at=now();
  inv.reminders=[...(inv.reminders||[]),{at,text,step:stepIdx==null?null:stepIdx+1,auto:!!auto,by:auto?null:me().id,channel:inv.channel||"whatsapp"}].slice(-40);
  if(stepIdx!=null){ const c=collectCfg(); const sent=new Set(inv.sent||[]); for(let k=0;k<=stepIdx;k++) sent.add(k); inv.sent=[...sent]; }
  await writeInvoice(inv);
  const l=inv.leadId&&S.leads.get(inv.leadId);
  if(l){ const x=structuredClone(l); x.messages.push({from:auto?"auto":"agente",text,at,cobro:true,by:auto?undefined:me().id}); x.lastOutboundAt=at; await writeLead(x); }
}
let collectBusy=false;
async function runCollect(manual){
  if(SRV){ if(manual) await srvRun(); return; }
  if(collectBusy || !featOn("collect") || tenant().status==="suspendido") return;
  if(!(await lockOk(P("locks/collect")))){ if(manual) toast("Otro equipo está enviando los recordatorios. Intente en un minuto."); return; }
  collectBusy=true; let n=0;
  try{
    const c=collectCfg();
    for(const inv of invArr()){
      const nr=nextReminder(inv); if(!nr || nr.at>now()) continue;
      if(!collectAllowedAt(now())) continue;
      const sameClient=invArr().filter(o=>(o.leadId&&o.leadId===inv.leadId)||(o.phone&&o.phone===inv.phone));
      if(sameClient.some(o=>(o.reminders||[]).some(r=>sameDay(r.at,now())))) continue;
      let k=nr.step; while(k+1<c.steps.length && (inv.dueAt+(Number(c.steps[k+1].offset)||0)*DAY)<=now()) k++;
      await sendReminder(inv.id, fillCollect(c.steps[k].text, inv), k, true); n++;
    }
  } finally { collectBusy=false; }
  if(manual || n) toast(n?`${n} recordatorio${n>1?"s":""} de pago enviado${n>1?"s":""}`:"No hay recordatorios pendientes");
}
async function aiCollectText(inv){

Datos: cliente=${inv.client}; concepto=${inv.concept}; saldo=${cop(balOf(inv))}; vence=${fdate(inv.dueAt)}; días de retraso=${Math.max(0,lateDays(inv))}; recordatorios ya enviados=${(inv.reminders||[]).length}; abonos=${cop(paidOf(inv))}.
Medios de pago: ${collectCfg().payInfo}
Devuelve solo el texto del mensaje.`;
    const {text}=await S.sample(pr,{modelTier:"quick",cache:false}); trackAI(pr,text); return text.trim()||base;
  }catch{ return base; }
}

  const rows=parseCSV(txt); if(rows.length<2){ toast("El archivo no tiene filas para importar."); return; }
  const h=rows[0].map(norm), idx=k=>h.findIndex(x=>k.some(w=>x.includes(w)));
  const iC=idx(["cliente","nombre"]), iP=idx(["tel","cel","whats"]), iE=idx(["correo","email"]), iK=idx(["concepto","detalle","descripcion"]), iV=idx(["saldo","valor","monto"]), iD=idx(["vence","vencimiento","fecha"]);
  let n=nextNumber(), c=0;
  for(const r of rows.slice(1)){ const amount=Number(String(r[iV]||"").replace(/[^\d]/g,""))||0; const client=(r[iC]||"").trim(); if(!client||!amount) continue;
    let due=now()+30*DAY; const ds=(r[iD]||"").trim(); if(/^\d{4}-\d{2}-\d{2}$/.test(ds)) due=fromDateInput(ds); else if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(ds)){ const [d,m,y]=ds.split("/").map(Number); due=new Date(y,m-1,d,12).getTime(); }
    writeInvoice({id:uid("iv"), number:"CXC-"+String(n++).padStart(4,"0"), client, phone:(r[iP]||"").trim(), email:(r[iE]||"").trim(), concept:(r[iK]||"").trim(), amount, issuedAt:now(), dueAt:due, channel:"whatsapp", payments:[], reminders:[], sent:[], createdAt:Date.now(), by:me().id}); c++; }
  toast(`${c} cuentas por cobrar importadas`);
}

const billArr = () => [...S.billing.values()].sort((a,b)=>(b.dueAt||0)-(a.dueAt||0));
function fillBill(t, b){
  if(!b.period) t=String(t||"").replace(/mensualidad de Gestión ComercIAl de \{periodo\}|mensualidad de \{periodo\}/g, "pago de {periodo}");
  return String(t||"").replaceAll("{empresa}", b.tenantName||"").replaceAll("{periodo}", b.period?MES(b.period):(b.concept||""))
    .replaceAll("{saldo}", cop(balOf(b))).replaceAll("{valor}", cop(b.amount)).replaceAll("{vence}", fdate(b.dueAt)).replaceAll("{numero}", b.number||"")
    .replaceAll("{pago}", billCfg().payInfo||"").replace(/\s+/g," ").trim();
}
function nextBillReminder(b){
  const c=billCfg(); if(!c.enabled || b.paused || balOf(b)<=0) return null;
  const sent=b.sent||[]; for(let k=0;k<c.steps.length;k++) if(!sent.includes(k)) return {step:k, at:(b.dueAt||0)+(Number(c.steps[k].offset)||0)*DAY};
  return null;
}
function writeBill(b){ b.updatedAt=Date.now(); S.billing.set(b.id,b); render(); const x=JSON.parse(JSON.stringify(b)); delete x.id; return writeDoc("billing/"+b.id, x); }
function nextBillNumber(){ return Math.max(0,...billArr().map(b=>Number(String(b.number||"").match(/(\d+)/)?.[1])||0))+1; }
async function billRemind(id, text, step, auto){
  const b=structuredClone(S.billing.get(id)); if(!b) return;
  b.reminders=[...(b.reminders||[]),{at:now(),text,step:step==null?null:step+1,auto:!!auto}].slice(-30);
  if(step!=null){ const s=new Set(b.sent||[]); for(let k=0;k<=step;k++) s.add(k); b.sent=[...s]; }
  await writeBill(b);
}
let billBusy=false;
async function runBilling(manual){
  if(SRV){ if(manual) await srvRun(); return; }
  if(billBusy || !isProv()) return;
  if(!(await lockOk("locks/billing"))){ if(manual) toast("Otro equipo está enviando los recordatorios. Intente en un minuto."); return; }
  billBusy=true; let n=0;
  try{ const c=billCfg();
    for(const b of billArr()){ const nr=nextBillReminder(b); if(!nr||nr.at>now()) continue;
      let k=nr.step; while(k+1<c.steps.length && b.dueAt+(Number(c.steps[k+1].offset)||0)*DAY<=now()) k++;
      await billRemind(b.id, fillBill(c.steps[k].text,b), k, true); n++; }
  } finally{ billBusy=false; }
  if(manual||n) toast(n?`${n} recordatorio${n>1?"s":""} de mensualidad enviado${n>1?"s":""}`:"No hay recordatorios pendientes");
}
function tenantDebt(tid){ const o=billArr().filter(b=>b.tid===tid && balOf(b)>0); return {bal:o.reduce((s,b)=>s+balOf(b),0), late:Math.max(0,...o.map(b=>lateDays(b))), n:o.length}; }
async function generateMonth(period){
  const [y,m]=period.split("-").map(Number); const due=new Date(y,m-1,Math.min(28,billCfg().dueDay),12).getTime();
  let n=nextBillNumber(), c=0;
  for(const t of S.tenants.values()){
    if(t.status!=="activo") continue;
    if(billArr().some(b=>b.tid===t.id && b.period===period && b.kind==="mensualidad")) continue;
    const ex=extraSedes(t);
    await writeBill({id:uid("bl"), kind:"mensualidad", number:"MEN-"+String(n++).padStart(4,"0"), tid:t.id, tenantName:t.name, period, plan:t.plan,
      concept:`Mensualidad plan ${PLANS[t.plan]?.label||""}${ex?` + ${ex} sede${ex>1?"s":""} adicional${ex>1?"es":""}`:""}`, amount:tenantFee(t), issuedAt:now(), dueAt:due, payments:[], reminders:[], sent:[], createdAt:Date.now()});
    c++;
  }
  toast(c?`${c} mensualidad${c>1?"es":""} de ${MES(period)} generada${c>1?"s":""}`:`Las mensualidades de ${MES(period)} ya estaban generadas`);
}
async function chargeInstall(t){
  if(billArr().some(b=>b.tid===t.id && b.kind==="instalacion")) return;
  await writeBill({id:uid("bl"), kind:"instalacion", number:"CFG-"+String(nextBillNumber()).padStart(4,"0"), tid:t.id, tenantName:t.name, period:"", plan:t.plan,
    concept:"Configuración inicial de Gestión ComercIAl", amount:platform().pricing.install||0, issuedAt:now(), dueAt:now()+5*DAY, payments:[], reminders:[], sent:[], createdAt:Date.now()});
}

/* ======================= PAQUETE DE MEJORAS ======================= */
/* ---------- calendario Colombia: festivos (Ley Emiliani) ---------- */
const _holCache={};
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
function holidays(y){
  if(_holCache[y]) return _holCache[y];
  const out=new Set(); const k=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  const fixed=d=>out.add(k(d));
  const monday=d=>{ const x=new Date(d); const wd=x.getDay(); if(wd!==1) x.setDate(x.getDate()+((8-wd)%7)); out.add(k(x)); };
  [[1,1],[5,1],[7,20],[8,7],[12,8],[12,25]].forEach(([m,d])=>fixed(new Date(y,m-1,d)));
  [[1,6],[3,19],[6,29],[8,15],[10,12],[11,1],[11,11]].forEach(([m,d])=>monday(new Date(y,m-1,d)));
  const E=easter(y), add=n=>{ const x=new Date(E); x.setDate(x.getDate()+n); return x; };
  fixed(add(-3)); fixed(add(-2)); monday(add(39)); monday(add(60)); monday(add(68));
  return _holCache[y]=out;
}
const isHoliday = ts => { const d=new Date(ts); return holidays(d.getFullYear()).has(`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`); };
/* Ley 2300 de 2023: cobranza solo L-V 7:00-19:00 y sábados 8:00-15:00; nunca domingos ni festivos; máximo una vez al día */
function collectAllowedAt(ts){
  const d=new Date(ts), wd=d.getDay(), h=d.getHours()+d.getMinutes()/60;
  if(wd===0 || isHoliday(ts)) return false;
  if(wd===6) return h>=8 && h<15;
  return h>=7 && h<19;
}

function autoAssign(l){

  if(b.assign==="sede" && l.sede) { const p2=pool.filter(u=>u.sede===l.sede); if(p2.length) pool=p2; }

function waitingMin(l){
  if(!active(l)) return 0;
  const ms=l.messages||[]; if(!ms.length) return 0;
  if(!(l.awaiting==="empresa" || l.handoff)) return 0;
  let since=null; for(let i=ms.length-1;i>=0;i--){ if(ms[i].from==="agente") break; if(ms[i].from==="cliente") since=ms[i].at; }
  return since? Math.floor((now()-since)/60000) : 0;
}
const slaLate = l => waitingMin(l) >= (Number(biz().slaMin)||15);

/* ---------- agenda ---------- */
const apptArr = () => [...S.appts.values()].sort((a,b)=>a.at-b.at);
function freeSlots(n=8, fromTs=now()){
  const b=biz(), step=(Number(b.slotMin)||30)*60000, out=[];
  const busy=new Set(apptArr().filter(a=>a.status!=="cancelada").map(a=>a.at));
  const start=new Date(fromTs); start.setMinutes(Math.ceil(start.getMinutes()/30)*30,0,0);
  for(let t=start.getTime()+60*60000; t<fromTs+21*DAY && out.length<n; t+=step){
    if(isOpen(t) && isOpen(t+step-60000) && !busy.has(t)) out.push(t);
  }
  return out;
}
function writeAppt(a){ a.updatedAt=Date.now(); S.appts.set(a.id,a); render(); const x={...a}; delete x.id; return writeDoc(P("appts/"+a.id), x); }
async function bookAppt(leadId, at, service, by){
  const l=S.leads.get(leadId); if(!l) return null;
  if(apptArr().some(a=>a.at===at && a.status!=="cancelada")) return null;
  const a={id:uid("ap"), leadId, client:l.name||l.phone||"Cliente", phone:l.phone||"", service:service||l.interest||"Cita", at, sede:l.sede||"", owner:l.owner||"", status:"programada", reminded:false, createdAt:Date.now(), by:by||"asistente"};
  await writeAppt(a);
  const x=structuredClone(S.leads.get(leadId)); if(STAGE_ORDER[x.stage]<3) setStageRaw(x,"propuesta"); await writeLead(x);
  logAudit("Cita agendada", `${a.client} · ${fdt(at)}`);
  return a;
}
let apptBusy=false;
async function runAppts(){
  if(SRV) return;
  if(apptBusy || !biz().agendaOn) return; apptBusy=true;
  try{ for(const a of apptArr()){ if(a.status!=="programada"||a.reminded) continue; if(a.at-now()<= (Number(biz().remindHours)||24)*3600e3 && a.at>now()){
      const l=S.leads.get(a.leadId); const x={...a, reminded:true}; await writeAppt(x);
      if(l){ const y=structuredClone(l); y.messages.push({from:"auto", text:`Hola ${(a.client||"").replace(/^Ejemplo\s*·\s*/,"").split(" ")[0]}, le recordamos su cita de ${a.service} el ${fdt(a.at)} en ${S.config.company}. Responda SÍ para confirmar o escríbanos si necesita cambiarla.`, at:now(), appt:a.id}); y.lastOutboundAt=now(); await writeLead(y); }
  } } } finally{ apptBusy=false; }
}

function setStageRaw(x, stage){
  if(x.stage===stage) return x;
  x.stageLog=[...(x.stageLog||[{stage:x.stage||"nuevo", at:x.createdAt||now()}]), {stage, at:now()}].slice(-30);
  x.stage=stage; return x;
}
async function setStage(id, stage){
  const l=S.leads.get(id); if(!l || l.stage===stage) return;
  if(stage==="perdido"){ S.lossFor=id; render(); return; }
  const x=setStageRaw(structuredClone(l), stage); delete x.lossReason;
  if(stage==="ganado" && biz().survey.on && !x.surveySent && !x.optOut){ x.messages.push({from:"auto", text:biz().survey.text, at:now(), survey:true}); x.surveySent=now(); x.awaitSurvey=true; x.lastOutboundAt=now(); }
  await writeLead(x); logAudit("Cambio de etapa", `${l.name||"Sin nombre"}: ${stageLabel(l.stage)} → ${stageLabel(stage)}`);
}

function svgBars(series, labels, opts={}){
  const W=900,H=170,pad=44, n=labels.length, raw=Math.max(...series.flatMap(s=>s.data),0);
  if(!raw) return '<p class="muted">Sin datos en estos meses.</p>';
  const max=opts.money?raw:Math.max(4,Math.ceil(raw/2)*2);
  const bw=(W-pad*2)/n/(series.length+0.6);
  const ticks=[0,.5,1].map(f=>max*f);
  const fmtT=t=>opts.money?(t>=1e6?(t/1e6).toFixed(1).replace(".0","")+" M":Math.round(t/1000)+" mil"):Math.round(t);
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H+28}" width="100%" role="img" aria-label="${esc(opts.label||"Gráfica")}" style="max-width:100%;height:auto;font-family:var(--f-body)">
    ${ticks.map(t=>{const y=H-(t/max)*(H-20);return `<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmtT(t)}</text>`}).join("")}
    ${labels.map((lb,i)=>{ const bwx=Math.min(bw,46); const x0=pad+i*(W-pad*2)/n+((W-pad*2)/n-bwx*series.length)/2; return series.map((s,j)=>{const v=s.data[i]||0,h=(v/max)*(H-20);return `<rect x="${x0+j*bwx}" y="${H-h}" width="${bwx-3}" height="${Math.max(0,h)}" rx="3" fill="${s.color}"><title>${esc(s.name)}: ${opts.money?cop(v):v}</title></rect>`}).join("")+`<text x="${x0+bwx*series.length/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${esc(lb)}</text>`; }).join("")}
  </svg></div><div class="row" style="gap:12px;font-size:12px">${series.map(s=>`<span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:2px;background:${s.color};display:inline-block"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

  <div class="panel"><h2>Embudo detallado</h2><div class="tablewrap"><table><thead><tr><th>Etapa</th><th>Llegaron</th><th>Pasan a la siguiente</th><th>Días promedio</th></tr></thead><tbody>${fun.map(([s,n],i)=>`<tr><td>${stageLabel(s)}</td><td class="mono">${n}</td><td class="mono">${i<fun.length-1?(n?Math.round(fun[i+1][1]/n*100)+"%":"—"):"—"}</td><td class="mono">${(()=>{const d=dwell(s);return d==null?"—":d.toFixed(1)})()}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel"><h2>Por qué se pierden ventas</h2>${lost.length?`<div class="bars">${Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="l"><span>${esc(k)}</span><div class="bar"><i style="width:${v/lost.length*100}%;background:var(--bad)"></i></div><span class="mono">${v}</span></div>`).join("")}</div>`:'<p class="muted">Sin ventas perdidas registradas.</p>'}</div>

function insightsPanel(m,d){
  const out=[];
  const best=[...d.roi].sort((a,b)=>b.w-a.w||b.nl-a.nl)[0]; if(best&&best.nl) out.push(`El canal que más prospectos trajo en ${MES(m)} fue ${(CHANNELS[best.k]||{}).label}: ${best.nl} prospectos y ${best.w} ventas.`);
  const paid=d.roi.filter(r=>r.spend); if(paid.length){ const top=paid.sort((a,b)=>(b.val/b.spend)-(a.val/a.spend))[0]; out.push(`La publicidad que más rindió fue ${(CHANNELS[top.k]||{}).label}: cada peso invertido devolvió ${(top.val/top.spend).toFixed(1)} en ventas.`); }
  const fast=d.people.filter(p=>p.avg!=null).sort((a,b)=>a.avg-b.avg); if(fast.length) out.push(`${fast[0].u.name} es quien responde más rápido (${fast[0].avg<60?Math.round(fast[0].avg)+" min":(fast[0].avg/60).toFixed(1)+" h"} en promedio).${fast.length>1?` ${fast[fast.length-1].u.name} es quien más tarda.`:""}`);
  const late=d.people.filter(p=>p.late); if(late.length) out.push(`Ahora hay clientes esperando con demora en el equipo de ${late.map(p=>p.u.name).join(", ")}.`);
  const top=Object.entries(d.reasons).sort((a,b)=>b[1]-a[1])[0]; if(top&&d.lost.length) out.push(`El principal motivo de pérdida es «${top[0]}» (${Math.round(top[1]/d.lost.length*100)}% de las ventas perdidas).`);
  let ph=[0,0,0]; d.grid.forEach((row,day)=>row.forEach((v,h)=>{ if(v>ph[0]) ph=[v,day,h]; })); if(ph[0]) out.push(`La hora con más mensajes es ${DAYS[ph[1]].toLowerCase()} a las ${ph[2]}:00. Conviene tener asesores disponibles en ese horario.`);
  if(d.unk.length) out.push(`El asistente no supo responder ${d.unk.length} pregunta${d.unk.length>1?"s":""}. Agregarlas a la Base de conocimiento mejora las respuestas automáticas.`);

}

function syncTenantStats(){
  if(!S.db || !S.leadsLoaded || Date.now()-lastStats<10*60000) return; lastStats=Date.now();
  const t=S.tenants.get(S.tid); if(!t) return;
  const L=allLeads(); const lastAct=Math.max(0,...L.map(l=>l.updatedAt||0));
  const st={conv:convThisMonth(), leads:L.length, users:usersArr().filter(u=>u.active!==false).length, lastAct, kb:!!(S.config.services||"").trim(), conns:Object.values(S.conns||{}).filter(c=>c.status==="activo").length, at:Date.now()};
  if(JSON.stringify({...t.stats,at:0})===JSON.stringify({...st,at:0})) return;
  writeTenant({...t, stats:st});

function healthOf(t){
  const s=t.stats; if(!s) return ["Sin datos","chip"];
  const days=(Date.now()-(s.lastAct||0))/DAY, use=(s.conv||0)/((PLANS[t.plan]||PLANS.pro).maxConv);
  let score=100; if(days>7) score-=40; if(days>21) score-=30; if(!s.kb) score-=15; if(!s.conns) score-=15; if(use<0.02) score-=10; const debt=tenantDebt(t.id); if(debt.late>0) score-=20;

}

  const inp=$("#simtxt"); const txt=inp.value.trim(); if(!txt) return; inp.value="";
  let id=S.simLead;
  if(!id || !S.leads.has(id)){ const l=newLeadAssigned({channel:$("#simch").value, sim:true}); id=l.id; S.simLead=id; LS.set("simLead",id); await writeLead(l); }
  await inbound(id, txt);
  setTimeout(()=>$("#simtxt")?.focus(),50);
}
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="simtxt"){ e.preventDefault(); simSend(); }
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey) && e.target.id==="reply"){ e.preventDefault(); document.querySelector('[data-act="send"]')?.click(); }
  if(e.key==="Escape" && S.adding){ S.adding=false; render(); }
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.search=e.target.value; render(); }
  if(e.target.id==="calc"){ S.calc.clients=Number(e.target.value); render(); }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.id==="chf"){ S.chFilter=t.value; render(); }
  if(t.id==="ai-switch" && isProv()){ S.platform={...platform(), aiOn:t.checked}; render(); writeDoc("platform/settings", S.platform, t.checked?"Inteligencia artificial activada":"Inteligencia artificial desactivada"); }
  if(t.id==="sedeF"||t.id==="repSede"){ S.sedeFilter=t.value; render(); }
  if(t.id==="repMonth"){ S.repMonth=t.value; render(); }
  if(t.id==="tenSel"){ switchTenant(t.value); toast("Abrió "+(S.tenants.get(t.value)?.name||"la empresa")); }
  if(t.dataset.tplan){ const tn=S.tenants.get(t.dataset.tplan); if(tn&&isProv()){ await writeTenant({...tn, plan:t.value}); toast(`${tn.name}: plan ${PLANS[t.value].label}`); } }
  if(t.dataset.tpaid){ const tn=S.tenants.get(t.dataset.tpaid); if(tn&&isProv()&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){ await writeTenant({...tn, paidUntil:t.value}); toast(`${tn.name}: pagado hasta ${fechaPago(t.value)} · ${estadoPago({...tn,paidUntil:t.value}).t}`); } }
  if(t.dataset.tstatus){ const tn=S.tenants.get(t.dataset.tstatus); if(tn&&isProv()){ await writeTenant({...tn, status:t.value}); toast(`${tn.name}: ${t.value}`); } }
  if(t.dataset.tkstatus){ const tk=S.tickets.get(t.dataset.tkstatus); if(tk){ await writeTicket({...tk, status:t.value}); toast("Estado actualizado"); } }
  if(t.id==="meSel"){ S.me=t.value; LS.set("me",t.value); S.sel=null; S.editUser=null; S.fresh=true; render(); toast("Ahora está viendo como "+userName(t.value)); }
  if(t.id==="logoIn"){ const f=t.files[0]; t.value=""; if(f){ if(f.size>8e6){toast("La imagen pesa más de 8 MB. Use una más liviana.");return;} try{ writeLogo(await resizeImage(f)); toast("Logo guardado"); }catch{ toast("No se pudo leer la imagen. Pruebe con PNG o JPG."); } } }
  if(t.id==="simch"){ LS.set("simch",t.value); const l=S.simLead&&S.leads.get(S.simLead); if(l){ const x=structuredClone(l); x.channel=t.value; writeLead(x);} }
  if(t.id==="pause"){ const l=S.leads.get(S.sel); if(l){ const x=structuredClone(l); x.followPaused=t.checked; await writeLead(x); toast(t.checked?"Automatización pausada para este prospecto":"Automatización reactivada"); } }
  if(t.id==="autoFollow") writeConfig({autoFollow:t.checked, steps:readSteps()});
  if(t.id==="aiFollow") writeConfig({aiFollow:t.checked, steps:readSteps()});
  if(t.id==="autoReply") writeConfig({autoReply:t.checked});
  if(t.dataset.stage){ await setStage(t.dataset.stage, t.value); }
  if(t.id==="csvIn"||t.id==="csvIn2"){ const f=t.files[0]; if(f){ const r=new FileReader(); r.onload=()=>importCSV(String(r.result)); r.readAsText(f); t.value=""; } }
});
document.addEventListener("submit", async e=>{
  if(e.target.id!=="leadForm") return; e.preventDefault();
  const g=id=>$("#fm-"+id).value.trim();
  if(!g("name")){ toast("Escriba su nombre para enviar."); $("#fm-name").focus(); return; }
  if(biz().privacy.on && !$("#fm-ok")?.checked){ toast("Debe autorizar el tratamiento de datos para enviar."); return; }
  const t=now();
  const l=newLeadAssigned({channel:"form",name:g("name"),phone:g("phone"),email:g("email"),interest:g("interest"),score:40, sede:$("#fm-sede")?.value||""});
  l.messages.push({from:"cliente",text:`Solicitud por formulario${g("interest")?": "+g("interest"):""}.${g("msg")?" "+g("msg"):""}`,at:t});
  l.messages.push({from:"auto",text:fill(S.config.formWelcome,l),at:t+1000});
  l.stage="contactado"; l.lastInboundAt=t; l.lastOutboundAt=t+1000; l.awaiting="cliente"; if(biz().privacy.on){ l.consent="aceptado"; l.consentAt=t; l.consentAsked=t; }
  await writeLead(l); e.target.reset(); toast("Solicitud recibida. Ya está en Prospectos con respuesta enviada.");
});
/* drag and drop */
document.addEventListener("dragstart", e=>{ const c=e.target.closest?.("[data-drag]"); if(c){ e.dataTransfer.setData("text/plain",c.dataset.drag); e.dataTransfer.effectAllowed="move"; } });
document.addEventListener("dragover", e=>{ const c=e.target.closest?.("[data-drop]"); if(c){ e.preventDefault(); c.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const c=e.target.closest?.("[data-drop]"); if(c && !c.contains(e.relatedTarget)) c.classList.remove("over"); });
document.addEventListener("drop", async e=>{ const c=e.target.closest?.("[data-drop]"); if(!c) return; e.preventDefault(); c.classList.remove("over"); const id=e.dataTransfer.getData("text/plain"); await setStage(id, c.dataset.drop); });

/* ---------- boot ---------- */
let tenantUnsubs=[];
function subscribeTenant(){
  tenantUnsubs.forEach(u=>{ try{u()}catch{} }); tenantUnsubs=[];
  S.leads=new Map(); S.users=new Map(); S.config=structuredClone(DEFAULT_CONFIG); S.logo=""; S.usage={calls:0,inTok:0,outTok:0}; S.conns={}; S.sedes=new Map(); S.invoices=new Map(); S.invSel=null; S.invNew=null; S.appts=new Map(); S.audit=new Map(); S.askOut="";
  S.leadsLoaded=false; S.sel=null; S.editUser=null; S.wizard=null; render();
  const db=S.db; if(!db){ S.leadsLoaded=true; return; }
  const toMap = snap => { const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id,{...JSON.parse(JSON.stringify(d.data())), id:d.id}); }); return m; };
  const tid=S.tid, mine=f=>(...a)=>{ if(S.tid===tid) f(...a); };
  tenantUnsubs.push(
    db.doc(P("config/main")).onSnapshot(mine(snap=>{ S.config = snap.exists ? {...structuredClone(DEFAULT_CONFIG), ...JSON.parse(JSON.stringify(snap.data()))} : structuredClone(DEFAULT_CONFIG); S.configLoaded=true; render(); }), ()=>{}),
    db.collection(P("users")).onSnapshot(mine(snap=>{ S.users=toMap(snap); render(); }), ()=>{}),
    db.doc(P("config/logo")).onSnapshot(mine(snap=>{ S.logo = snap.exists ? String(snap.data().data||"") : ""; render(); }), ()=>{}),
    db.doc(P("config/connections")).onSnapshot(mine(snap=>{ S.conns = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {}; render(); }), ()=>{}),
    db.collection(P("appts")).onSnapshot(mine(snap=>{ S.appts=toMap(snap); render(); }), ()=>{}),
    db.collection(P("audit")).onSnapshot(mine(snap=>{ S.audit=toMap(snap); }), ()=>{}),
    db.collection(P("invoices")).onSnapshot(mine(snap=>{ S.invoices=toMap(snap); render(); }), ()=>{}),
    db.collection(P("sedes")).onSnapshot(mine(snap=>{ S.sedes=toMap(snap); render(); }), ()=>{}),
    db.doc(P("usage/"+monthKey())).onSnapshot(mine(snap=>{ if(snap.exists){ const d=snap.data(); if((d.calls||0)>=(S.usage.calls||0)) S.usage={calls:d.calls||0,inTok:d.inTok||0,outTok:d.outTok||0}; render(); } }), ()=>{}),
    db.collection(P("leads")).onSnapshot(mine(snap=>{ S.leads=toMap(snap); S.leadsLoaded=true; render(); }), ()=>{ S.leadsLoaded=true; toast("Se perdió la conexión con los datos. Recargue la página."); render(); })
  );
}
function switchTenant(tid){ if(tid===S.tid) return; S.tid=tid; LS.set("tid",tid); S.simLead=null; LS.set("simLead",null); subscribeTenant(); }
render();
(async()=>{
  const C = window.claude;
  if(!C || !C.use){ S.leadsLoaded=true; S.configLoaded=true; render(); return; }
  const [db, sample, downloads] = await Promise.all([C.use("db").catch(()=>null), C.use("sample").catch(()=>null), C.use("downloads").catch(()=>null)]);
  S.sample=sample; S.downloads=downloads; S.db=db;
  if(!db){ S.leadsLoaded=true; S.configLoaded=true; render(); return; }
  const toMap = snap => { const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id,{...JSON.parse(JSON.stringify(d.data())), id:d.id}); }); return m; };
  db.collection("tenants").onSnapshot(snap=>{ S.tenants=toMap(snap); if(S.tenants.size && !S.tenants.has(S.tid)){ S.tid=[...S.tenants.keys()][0]; LS.set("tid",S.tid); subscribeTenant(); } render(); }, ()=>{});
  db.collection("staff").onSnapshot(snap=>{ S.staff=toMap(snap); render(); }, ()=>{});
  db.doc("platform/settings").onSnapshot(snap=>{ if(snap.exists){ const d=JSON.parse(JSON.stringify(snap.data())); S.platform={pricing:{...DEFAULT_CONFIG.pricing,...(d.pricing||{})}, aiRates:{...DEFAULT_CONFIG.aiRates,...(d.aiRates||{})}, billing:d.billing, aiOn:!!d.aiOn}; render(); } }, ()=>{});
  db.collection("billing").onSnapshot(snap=>{ S.billing=toMap(snap); render(); }, ()=>{});
  db.collection("tickets").onSnapshot(snap=>{ S.tickets=toMap(snap); render(); }, ()=>{});
  subscribeTenant();
})();
})();
</script>
